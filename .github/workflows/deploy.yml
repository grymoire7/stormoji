name: Deploy to DreamHost

# Production only changes when a version tag (vX.Y.Z) is pushed, so work can
# land on main without shipping. workflow_dispatch is a manual escape hatch
# (e.g. to redeploy an older tag: choose it in the "Use workflow from" menu).
# See "Releasing" in CLAUDE.md.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${pkg_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Deploy to DreamHost via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.DREAMHOST_HOST }}
          username: ${{ secrets.DREAMHOST_USERNAME }}
          password: ${{ secrets.DREAMHOST_PASSWORD }}
          port: 22
          local_path: "./*"
          remote_path: "/home/${{ secrets.DREAMHOST_USERNAME }}/stormoji.com/"
          delete_remote_files: false
          sftp_only: true
          rsyncArgs: "--exclude=.* --exclude=docs --exclude=scripts --exclude=app.test.js --exclude=CLAUDE.md --exclude=package.json"
